name: pr-checks

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tool
        run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check src hardware_tests tests sim motor_usb.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest tests/test_repo_contract.py tests/test_motor_usb.py -v
